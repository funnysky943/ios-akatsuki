[binaries]
c = ['clang', '-target', 'arm64-apple-ios16.5', '-isysroot', '/home/sky/ios-sdk/iPhoneOS16.5.sdk', '-fuse-ld=lld']
cpp = ['clang++', '-target', 'arm64-apple-ios16.5', '-isysroot', '/home/sky/ios-sdk/iPhoneOS16.5.sdk', '-fuse-ld=lld', '-fuse-cxa-atexit']
objc = ['clang', '-target', 'arm64-apple-ios16.5', '-isysroot', '/home/sky/ios-sdk/iPhoneOS16.5.sdk', '-fuse-ld=lld']
ar = 'llvm-ar'
ranlib = 'llvm-ranlib'
strip = 'llvm-strip'
pkg-config = 'false'

[host_machine]
system = 'darwin'
subsystem = 'ios'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
# meson's cc.has_header_symbol('time.h', 'struct timespec') answers NO when cross-compiling
# (it looks for a preprocessor symbol), so Mesa defines its own struct timespec and collides
# with the SDK's. The SDK has it.
c_args = ['-DHAVE_STRUCT_TIMESPEC']
cpp_args = ['-DHAVE_STRUCT_TIMESPEC']
