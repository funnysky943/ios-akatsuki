version: 2.1

jobs:
  build-kernel:
    macos:
      xcode: 15.4.0
    resource_class: m4pro.medium
    environment:
      DXB_REPO: https://github.com/blacktop/darwin-xnu-build
      DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
      MACOS_VERSION: "13.5"
      KERNEL_CONFIG: "DEVELOPMENT"
      MACHINE_CONFIG: "SWEET"
    steps:
      - checkout
      - run:
          name: Validate patch hunk counts
          command: python3 tools/check-hunk-counts.py xnu/patches
      - run:
          name: Fetch build script
          command: |
            git init -q dxb
            git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
            git -C dxb checkout -q FETCH_HEAD
            cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
            sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
            grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
            ls dxb/patches
      - run:
          name: Deps
          command: |
            brew install jq gum bash cmake ninja
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
            sudo chmod +x /usr/local/bin/xcodes
            sw_vers
            xcodebuild -version
            xcrun --find iig
      - run:
          name: Build
          command: |
            cd dxb
            export MAKEFLAGS="-k"
            bash build.sh 2>&1 | tee ../build.log
      - run:
          name: Fail on skipped project patches
          command: |
            if [ -f build.log ] && grep -E 'Skipping patch .*/patches/0[0-9]{3}-' build.log; then
              echo "ERROR: one or more ios-fajita patches were not applied"
              exit 1
            fi
            echo "no project patch was skipped"
          when: always
      - store_artifacts:
          path: build.log
          when: always
      - run:
          name: Collect
          command: |
            mkdir -p out
            cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
            ls -la out
            (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          when: always
      - run:
          name: Package patched framebuffer source
          command: |
            mkdir -p buildtree
            cp dxb/xnu/iokit/Kernel/arm/SweetFramebuffer.cpp buildtree/
            tar czf buildtree.tgz -C buildtree SweetFramebuffer.cpp
            ls -la buildtree.tgz
          when: always
      - store_artifacts:
          path: buildtree.tgz
          when: always
      - store_artifacts:
          path: out/
          when: always

workflows:
  build:
    jobs:
      - build-kernel
